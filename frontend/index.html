<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hostel Room Allocation</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --card: #f2f6ff;
      --border: #dce3ef;
      --text: #1f2a37;
      --muted: #58677b;
      --primary: #3f79f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page-wrapper {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 2.3rem;
    }
    header p {
      color: var(--muted);
      margin: 0;
    }
    main {
      display: grid;
      gap: 20px;
    }
    .form-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(16, 31, 64, 0.06);
    }
    .panel h2 {
      margin-top: 0;
    }
    label {
      display: block;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    label input,
    label select {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    button {
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.98rem;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }
    button:hover { transform: translateY(-1px); }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #ecf0f5;
    }
    th {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.82rem;
    }
    tbody tr:nth-child(even) { background: #fbfbff; }
    .message-box {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #c9d6f5;
      background: #eef3ff;
      color: #2345a9;
      margin-bottom: 16px;
    }
    .results-grid {
      display: grid;
      gap: 14px;
    }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .result-card h3 {
      margin-top: 0;
    }
    .result-card dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 8px 16px;
    }
    .result-card dt { color: var(--muted); }
    .result-card dd { margin: 0; }
    @media (max-width: 700px) {
      .button-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header>
      <h1>Hostel Room Allocation</h1>
      <p>Enter student and room data, then compare allocation results.</p>
    </header>

    <main>
      <section class="form-grid">
        <div class="panel">
          <h2>Add Room</h2>
          <form id="roomForm">
            <label>Room ID<input name="roomID" required type="number"></label>
            <label>Type<select name="roomType"><option>Single</option><option>Double</option><option>Triple</option></select></label>
            <label>Block<input name="block" type="text"></label>
            <label class="checkbox-row">Has AC<input name="hasAC" type="checkbox"></label>
            <label class="checkbox-row">Available<input name="isAvailable" type="checkbox" checked></label>
            <button type="submit">Add Room</button>
          </form>
        </div>

        <div class="panel">
          <h2>Add Student</h2>
          <form id="studentForm">
            <label>Student ID<input name="studentID" required type="number"></label>
            <label>Name<input name="name" required type="text"></label>
            <label>Gender<select name="gender"><option>Male</option><option>Female</option></select></label>
            <label>CGPA<input name="cgpa" type="number" step="0.01" min="0" max="10"></label>
            <label>Year<input name="year" type="number" min="1" max="4"></label>
            <label>Course<input name="course" type="text"></label>
            <label>Preferences<input name="preferences" placeholder="101,102" type="text"></label>
            <button type="submit">Add Student</button>
          </form>
        </div>
      </section>

      <section class="panel actions-panel">
        <h2>Actions</h2>
        <div class="button-row">
          <button id="refreshBtn">Refresh Lists</button>
          <button id="runGreedy">Run Greedy</button>
          <button id="runStable">Run Stable</button>
          <button id="compare">Compare</button>
          <button id="reset">Reset Data</button>
        </div>
      </section>

      <section class="panel data-panel">
        <h2>Rooms</h2>
        <div id="roomsContainer" class="table-wrapper">No rooms yet.</div>
      </section>

      <section class="panel data-panel">
        <h2>Students</h2>
        <div id="studentsContainer" class="table-wrapper">No students yet.</div>
      </section>

      <section class="panel result-panel">
        <h2>Result</h2>
        <div id="messageBox" class="message-box">Ready.</div>
        <div id="resultsContainer" class="results-grid"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
